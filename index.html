<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>카카오맵 문화유산 찾기 서비스</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      height: 100vh;
      overflow: hidden;
      background-color: #f5f5f5;
    }

    .container {
      display: flex;
      width: 100vw;
      height: 100vh;
    }

    .left-panel {
      width: 35%;
      min-width: 320px;
      height: 100%;
      background-color: #ffffff;
      border-right: 1px solid #ddd;
      display: flex;
      flex-direction: column;
      padding: 20px;
    }

    .right-panel {
      position: relative;
      flex: 1;
      height: 100%;
    }

    h1 {
      font-size: 22px;
      margin-bottom: 16px;
      color: #222;
    }

    .search-box {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    #keywordInput {
      flex: 1;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 15px;
    }

    #searchButton {
      padding: 12px 16px;
      border: none;
      border-radius: 6px;
      background-color: #fee500;
      color: #222;
      font-weight: bold;
      cursor: pointer;
    }

    #searchButton:hover {
      background-color: #f5d900;
    }

    .status-message {
      font-size: 14px;
      color: #666;
      margin-bottom: 12px;
      line-height: 1.4;
    }

    #placesList {
      list-style: none;
      overflow-y: auto;
      flex: 1;
      border-top: 1px solid #eee;
    }

    .place-item {
      padding: 14px 4px;
      border-bottom: 1px solid #eee;
      cursor: pointer;
    }

    .place-item:hover {
      background-color: #f7f7f7;
    }

    .place-name {
      font-size: 16px;
      font-weight: bold;
      color: #222;
      margin-bottom: 6px;
    }

    .place-address {
      font-size: 13px;
      color: #555;
      margin-bottom: 4px;
      line-height: 1.4;
    }

    .place-phone {
      font-size: 13px;
      color: #1976d2;
      margin-bottom: 4px;
    }

    .place-distance {
      font-size: 12px;
      color: #888;
    }

    #map {
      width: 100%;
      height: 100%;
    }

    .category-control {
      position: absolute;
      top: 16px;
      left: 16px;
      z-index: 10;
      display: flex;
      gap: 8px;
      padding: 10px;
      background-color: rgba(255, 255, 255, 0.95);
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.18);
    }

    .category-button {
      padding: 9px 12px;
      border: 1px solid #ddd;
      border-radius: 20px;
      background-color: #ffffff;
      color: #222;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }

    .category-button:hover {
      background-color: #fff7bf;
    }

    .category-button.active {
      background-color: #fee500;
      border-color: #f5d900;
    }

    .info-window {
      padding: 10px;
      font-size: 13px;
      line-height: 1.5;
      max-width: 240px;
    }

    .info-title {
      font-weight: bold;
      font-size: 14px;
      margin-bottom: 6px;
      color: #222;
    }

    .info-address {
      color: #555;
      margin-bottom: 4px;
    }

    .info-phone {
      color: #1976d2;
      margin-bottom: 4px;
    }

    .info-distance {
      color: #777;
      margin-bottom: 6px;
    }

    .info-link {
      color: #1565c0;
      text-decoration: none;
      font-weight: bold;
    }

    @media (max-width: 768px) {
      .container {
        flex-direction: column;
      }

      .left-panel {
        width: 100%;
        height: 45%;
        min-width: 0;
      }

      .right-panel {
        height: 55%;
      }

      .category-control {
        top: 10px;
        left: 10px;
        gap: 6px;
        padding: 8px;
      }

      .category-button {
        padding: 8px 10px;
        font-size: 13px;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="left-panel">
      <h1>문화유산 찾기</h1>

      <div class="search-box">
        <input
          type="text"
          id="keywordInput"
          placeholder="예: 고궁, 왕릉, 사찰"
        />
        <button id="searchButton">검색</button>
      </div>

      <p id="statusMessage" class="status-message">
        지도를 불러오는 중입니다.
      </p>

      <ul id="placesList"></ul>
    </div>

    <div class="right-panel">
      <div class="category-control">
        <button class="category-button" data-keyword="궁궐">고궁</button>
        <button class="category-button" data-keyword="왕릉">릉</button>
      </div>

      <div id="map"></div>
    </div>
  </div>

  <!-- 카카오맵 SDK: services 라이브러리는 장소 검색을 위해 필요합니다. -->
  <script
    src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=9f5e821f1187763f6e00679dc192251c&libraries=services&autoload=false">
  </script>

  <script>
    let map;
    let placesService;
    let infoWindow;
    let currentPosition;
    let currentMarker;
    let currentLocationInfo;
    let placeMarkers = [];

    const searchRadius = 20000;

    const defaultPosition = {
      latitude: 37.5665,
      longitude: 126.9780
    };

    const keywordInput = document.getElementById("keywordInput");
    const searchButton = document.getElementById("searchButton");
    const placesList = document.getElementById("placesList");
    const statusMessage = document.getElementById("statusMessage");
    const categoryButtons = document.querySelectorAll(".category-button");

    // 카카오맵 SDK가 완전히 로드된 뒤에 실행합니다.
    kakao.maps.load(function () {
      requestCurrentLocation();
    });

    // 현재 위치 권한을 요청합니다.
    function requestCurrentLocation() {
      statusMessage.textContent = "현재 위치를 확인하는 중입니다.";

      if (!navigator.geolocation) {
        statusMessage.textContent =
          "이 브라우저는 현재 위치 기능을 지원하지 않습니다. 기본 위치로 지도를 표시합니다.";
        createMap(defaultPosition.latitude, defaultPosition.longitude);
        return;
      }

      navigator.geolocation.getCurrentPosition(
        function (position) {
          const latitude = position.coords.latitude;
          const longitude = position.coords.longitude;

          statusMessage.textContent =
            "현재 위치를 기준으로 지도를 표시했습니다. 검색어를 입력하거나 카테고리를 선택해 주세요.";

          createMap(latitude, longitude);
        },
        function () {
          statusMessage.textContent =
            "현재 위치를 가져오지 못했습니다. 기본 위치로 지도를 표시합니다.";

          createMap(defaultPosition.latitude, defaultPosition.longitude);
        },
        {
          enableHighAccuracy: true,
          timeout: 10000,
          maximumAge: 60000
        }
      );
    }

    // 지도를 생성합니다.
    function createMap(latitude, longitude) {
      const mapContainer = document.getElementById("map");

      currentPosition = new kakao.maps.LatLng(latitude, longitude);

      const mapOption = {
        center: currentPosition,
        level: 5
      };

      map = new kakao.maps.Map(mapContainer, mapOption);

      // 지도 객체를 기준으로 장소 검색 서비스를 생성합니다.
      placesService = new kakao.maps.services.Places(map);
      infoWindow = new kakao.maps.InfoWindow({ zIndex: 1 });

      showCurrentLocationMarker();
      setSearchEvents();
      setCategoryEvents();
    }

    // 현재 위치 마커를 표시합니다.
    function showCurrentLocationMarker() {
      currentMarker = new kakao.maps.Marker({
        map: map,
        position: currentPosition
      });

      currentLocationInfo = new kakao.maps.InfoWindow({
        content: '<div style="padding:8px;font-size:13px;">현재 위치</div>'
      });

      currentLocationInfo.open(map, currentMarker);
    }

    // 검색 버튼과 엔터키 이벤트를 설정합니다.
    function setSearchEvents() {
      searchButton.addEventListener("click", function () {
        searchPlacesByKeyword();
      });

      keywordInput.addEventListener("keydown", function (event) {
        if (event.key === "Enter") {
          searchPlacesByKeyword();
        }
      });
    }

    // 카테고리 버튼 이벤트를 설정합니다.
    function setCategoryEvents() {
      categoryButtons.forEach(function (button) {
        button.addEventListener("click", function () {
          const keyword = button.dataset.keyword;

          keywordInput.value = button.textContent;
          setActiveCategoryButton(button);
          searchPlaces(keyword);
        });
      });
    }

    // 검색창에 입력한 키워드로 장소를 검색합니다.
    function searchPlacesByKeyword() {
      const keyword = keywordInput.value.trim();

      if (keyword === "") {
        alert("검색어를 입력해 주세요.");
        return;
      }

      clearActiveCategoryButton();
      searchPlaces(keyword);
    }

    // 카카오 지도 API의 장소 검색 기능으로 주변 장소를 검색합니다.
    function searchPlaces(keyword) {
      if (!map || !placesService || !currentPosition) {
        statusMessage.textContent =
          "지도가 아직 준비되지 않았습니다. 잠시 후 다시 검색해 주세요.";
        return;
      }

      clearSearchResults();

      statusMessage.textContent =
        `"${keyword}" 주변 장소를 검색 중입니다.`;

      // 카카오 API에는 기본 주변 키워드 검색만 요청합니다.
      // 거리 계산과 거리순 정렬은 아래 JavaScript 코드에서 직접 처리합니다.
      placesService.keywordSearch(keyword, placesSearchCallback, {
        location: currentPosition,
        radius: searchRadius,
        size: 15
      });
    }

    // 장소 검색 결과를 처리합니다.
    function placesSearchCallback(data, status) {
      console.log("검색 상태:", status);
      console.log("검색 결과:", data);

      if (status === kakao.maps.services.Status.OK) {
        const sortedPlaces = sortPlacesByDistance(data);

        statusMessage.textContent =
          `주변 검색 결과 ${sortedPlaces.length}개를 거리순으로 찾았습니다.`;

        displayPlaces(sortedPlaces);
      } else if (status === kakao.maps.services.Status.ZERO_RESULT) {
        statusMessage.textContent =
          "검색 결과가 없습니다. 다른 키워드로 검색해 보세요.";

        clearSearchResults();
      } else {
        statusMessage.textContent =
          "검색 요청이 실패했습니다. 검색어를 바꾸거나 새로고침 후 다시 시도해 주세요.";

        clearSearchResults();
      }
    }

    // 검색 결과를 현재 위치와 가까운 순서로 정렬합니다.
    function sortPlacesByDistance(places) {
      return places
        .map(function (place) {
          const distance = calculateDistance(
            currentPosition.getLat(),
            currentPosition.getLng(),
            Number(place.y),
            Number(place.x)
          );

          place.calculatedDistance = distance;
          return place;
        })
        .sort(function (firstPlace, secondPlace) {
          return firstPlace.calculatedDistance - secondPlace.calculatedDistance;
        });
    }

    // 두 좌표 사이의 거리를 계산합니다.
    function calculateDistance(lat1, lng1, lat2, lng2) {
      const earthRadius = 6371000;

      const latDifference = toRadian(lat2 - lat1);
      const lngDifference = toRadian(lng2 - lng1);

      const a =
        Math.sin(latDifference / 2) * Math.sin(latDifference / 2) +
        Math.cos(toRadian(lat1)) *
          Math.cos(toRadian(lat2)) *
          Math.sin(lngDifference / 2) *
          Math.sin(lngDifference / 2);

      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));

      return Math.round(earthRadius * c);
    }

    // 각도를 라디안으로 변환합니다.
    function toRadian(degree) {
      return degree * (Math.PI / 180);
    }

    // 검색 결과 목록과 마커를 표시합니다.
    function displayPlaces(places) {
      const bounds = new kakao.maps.LatLngBounds();

      places.forEach(function (place, index) {
        const placePosition = new kakao.maps.LatLng(place.y, place.x);
        const marker = addPlaceMarker(placePosition, place);

        bounds.extend(placePosition);

        const listItem = createPlaceListItem(place, index);

        // 왼쪽 리스트의 장소를 클릭하면 지도 이동 후 세부정보 팝업을 표시합니다.
        listItem.addEventListener("click", function () {
          moveToPlace(placePosition, marker, place);
        });

        placesList.appendChild(listItem);
      });

      if (places.length > 0) {
        map.setBounds(bounds);
      }
    }

    // 장소 마커를 지도에 추가합니다.
    function addPlaceMarker(position, place) {
      const marker = new kakao.maps.Marker({
        map: map,
        position: position,
        title: place.place_name
      });

      placeMarkers.push(marker);

      // 지도 위 마커를 클릭하면 세부정보 팝업을 표시합니다.
      kakao.maps.event.addListener(marker, "click", function () {
        showPlaceInfo(marker, place);
      });

      return marker;
    }

    // 검색 결과 리스트 항목을 만듭니다.
    function createPlaceListItem(place, index) {
      const listItem = document.createElement("li");
      listItem.className = "place-item";

      const placeName = document.createElement("div");
      placeName.className = "place-name";
      placeName.textContent = `${index + 1}. ${place.place_name}`;

      const placeAddress = document.createElement("div");
      placeAddress.className = "place-address";
      placeAddress.textContent =
        place.road_address_name || place.address_name || "주소 정보 없음";

      const placePhone = document.createElement("div");
      placePhone.className = "place-phone";
      placePhone.textContent = place.phone || "전화번호 정보 없음";

      const placeDistance = document.createElement("div");
      placeDistance.className = "place-distance";

      if (place.calculatedDistance) {
        placeDistance.textContent =
          `현재 위치에서 약 ${place.calculatedDistance.toLocaleString()}m`;
      } else {
        placeDistance.textContent = "거리 정보 없음";
      }

      listItem.appendChild(placeName);
      listItem.appendChild(placeAddress);
      listItem.appendChild(placePhone);
      listItem.appendChild(placeDistance);

      return listItem;
    }

    // 선택한 장소로 지도를 이동합니다.
    function moveToPlace(position, marker, place) {
      map.setCenter(position);
      map.setLevel(5);
      showPlaceInfo(marker, place);
    }

    // 장소 세부정보 팝업을 표시합니다.
    function showPlaceInfo(marker, place) {
      const placeName = escapeHtml(place.place_name);
      const placeAddress = escapeHtml(
        place.road_address_name || place.address_name || "주소 정보 없음"
      );
      const placePhone = escapeHtml(place.phone || "전화번호 정보 없음");
      const placeUrl = escapeHtml(place.place_url || "#");

      let distanceText = "거리 정보 없음";

      if (place.calculatedDistance) {
        distanceText =
          `현재 위치에서 약 ${place.calculatedDistance.toLocaleString()}m`;
      }

      const content = `
        <div class="info-window">
          <div class="info-title">${placeName}</div>
          <div class="info-address">${placeAddress}</div>
          <div class="info-phone">${placePhone}</div>
          <div class="info-distance">${distanceText}</div>
          <a class="info-link" href="${placeUrl}" target="_blank">
            카카오맵에서 자세히 보기
          </a>
        </div>
      `;

      infoWindow.setContent(content);
      infoWindow.open(map, marker);
    }

    // 클릭한 카테고리 버튼을 활성화 상태로 표시합니다.
    function setActiveCategoryButton(selectedButton) {
      categoryButtons.forEach(function (button) {
        button.classList.remove("active");
      });

      selectedButton.classList.add("active");
    }

    // 카테고리 버튼의 활성화 상태를 지웁니다.
    function clearActiveCategoryButton() {
      categoryButtons.forEach(function (button) {
        button.classList.remove("active");
      });
    }

    // 새로 검색할 때 기존 검색기록을 지웁니다.
    function clearSearchResults() {
      removePlaceMarkers();
      placesList.innerHTML = "";

      if (infoWindow) {
        infoWindow.close();
      }
    }

    // 기존 장소 마커들을 제거합니다.
    function removePlaceMarkers() {
      placeMarkers.forEach(function (marker) {
        marker.setMap(null);
      });

      placeMarkers = [];
    }

    // 팝업에 들어가는 문자열을 안전하게 처리합니다.
    function escapeHtml(text) {
      return String(text)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }
  </script>
</body>
</html>
